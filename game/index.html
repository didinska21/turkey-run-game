<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172b32">
  <title>TURKEY RUN: the great Thanksgiving escape — 5 zones, 3 chase bosses, 12 upgrades, 40+ obstacles, endless corn</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111e27; color: #fff0cc; }
    body { display: grid; place-items: center; font-family: Georgia, serif; }
    #stage { position: relative; width: min(100vw, 177.777778vh); aspect-ratio: 16 / 9; box-shadow: 0 0 100px #0008; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #access { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    #touch { position: absolute; inset: auto 12px 16px; display: none; justify-content: space-between; pointer-events: none; }
    #touch div { display: flex; gap: 8px; }
    #touch button { pointer-events: auto; touch-action: none; min-width: 56px; min-height: 48px; padding: 10px; border: 2px solid #fff0cc80; border-radius: 14px; background: #152c38c9; color: #fff0cc; font: bold 13px system-ui, sans-serif; }
    #touch button:active { background: #b9502e; }
    @media (pointer: coarse) { #touch[data-playing="true"] { display: flex; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="Turkey Run game">
    <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Turkey Run. Space to start or jump. Down to slide. P to pause and open upgrades."></canvas>
    <section id="access" aria-live="polite"><h1>TURKEY RUN: the great Thanksgiving escape</h1><p id="status">5 zones, 3 chase bosses, 12 upgrades, 45 obstacles. Press Space or click to play.</p></section>
    <nav id="touch" data-playing="false" aria-label="Touch controls">
      <div><button data-control="left" aria-label="Steer left">◀</button><button data-control="right" aria-label="Steer right">▶</button></div>
      <div><button data-control="pause">PAUSE</button><button data-control="slide">SLIDE</button><button data-control="jump">JUMP ↑</button></div>
    </nav>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
